<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasky</title>
    <link rel="shortcut icon" href="imagens/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="src/css/style-dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#181b24">
    <link rel="apple-touch-icon" href="imagens/icon-192.png">
</head>
<body class="carregando">
    <header class="dashboard-header">
        <div class="logo">Tasky</div>
        <div class="legenda" aria-label="Legenda de prioridades">
            <span class="high">Alta</span><span class="medium">Média</span><span class="low">Baixa</span>
        </div>
        <div class="header-right">
            <span id="save-status" class="save-status" role="status"></span>
            <div class="user-menu">
                <img id="user-avatar" src="imagens/porco.jpg" alt="Avatar" class="avatar-btn">
                <div id="user-dropdown" class="dropdown hidden">
                    <div class="user-info">
                        <img id="dropdown-avatar" src="imagens/porco.jpg" alt="">
                        <div><strong id="user-name">Usuário</strong><small id="user-email"></small></div>
                    </div>
                    <hr>
                    <button id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
                </div>
            </div>
        </div>
    </header>

    <main class="dashboard">
        <div class="dashboard-column" data-id="1" style="--column-color: #b9a8f5;">
            <div class="dashboard-title">
                <div class="title-left"><input type="color" class="color-picker" value="#b9a8f5" title="Mudar cor da coluna"><h2>A Fazer</h2></div>
                <div class="column-actions"><button class="add-card" title="Novo cartão"><i class="fa-solid fa-plus"></i></button><button class="delete-column" title="Excluir coluna"><i class="fa-solid fa-trash"></i></button></div>
            </div>
            <div class="dashboard-cards"></div>
        </div>
        <div class="dashboard-column" data-id="2" style="--column-color: #6cc5c0;">
            <div class="dashboard-title">
                <div class="title-left"><input type="color" class="color-picker" value="#6cc5c0" title="Mudar cor da coluna"><h2>Fazendo</h2></div>
                <div class="column-actions"><button class="add-card" title="Novo cartão"><i class="fa-solid fa-plus"></i></button><button class="delete-column" title="Excluir coluna"><i class="fa-solid fa-trash"></i></button></div>
            </div>
            <div class="dashboard-cards"></div>
        </div>
        <div class="dashboard-column" data-id="3" style="--column-color: #7ccf9b;">
            <div class="dashboard-title">
                <div class="title-left"><input type="color" class="color-picker" value="#7ccf9b" title="Mudar cor da coluna"><h2>Concluído</h2></div>
                <div class="column-actions"><button class="add-card" title="Novo cartão"><i class="fa-solid fa-plus"></i></button><button class="delete-column" title="Excluir coluna"><i class="fa-solid fa-trash"></i></button></div>
            </div>
            <div class="dashboard-cards"></div>
        </div>
        <button class="add-column"><i class="fa-solid fa-plus"></i><span>Adicionar coluna</span></button>
    </main>

    <script type="module" src="src/javascript/script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
        }
    </script>
</body>
</html>
